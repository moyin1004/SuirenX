syntax = "proto3";

package suirenx.asset.v1;

option go_package = "github.com/moyin1004/suirenx/services/api/biz/model/suirenx/asset/v1;assetv1";

import "api.proto";

message Asset {
  string id = 1;
  string name = 2;
  int64 price_cents = 3;
  string purchase_date = 4;
  // HTTP JSON status: ACTIVE or RETIRED.
  string status = 5;
  string image_url = 6;
  int32 held_days = 7;
  int64 daily_cost_cents = 8;
  string created_at = 9;
  string updated_at = 10;
  // YYYY-MM-DD for retired assets; empty string while active.
  string retired_date = 11;
  // RFC 3339 timestamp; empty string when not archived.
  string archived_at = 12;
  // Stable built-in icon key. Legacy assets default to devices.
  string icon_key = 13;
  string purchase_channel = 14;
  string warranty_end_date = 15;
  string notes = 16;
  repeated string tags = 17;
}

message ListAssetsRequest {
  // Optional HTTP query filter: ACTIVE or RETIRED (case-insensitive).
  string status = 1 [(api.query) = "status"];
  // CURRENT (default), ARCHIVED, or ALL. Independent of lifecycle status.
  string scope = 2 [(api.query) = "scope"];
}

message ListAssetsResponse {
  repeated Asset assets = 1;
}

message GetAssetRequest {
  string id = 1 [(api.path) = "id"];
}

message GetAssetResponse {
  Asset asset = 1;
}

message CreateAssetRequest {
  string name = 1 [(api.body) = "name"];
  int64 price_cents = 2 [(api.body) = "price_cents"];
  string purchase_date = 3 [(api.body) = "purchase_date"];
  string image_url = 4 [(api.body) = "image_url"];
  // devices, laptop, phone, tablet, headphones, watch, camera, gamepad,
  // book, keyboard, bicycle, home. Empty defaults to devices.
  string icon_key = 5 [(api.body) = "icon_key"];
  string purchase_channel = 6 [(api.body) = "purchase_channel"];
  string warranty_end_date = 7 [(api.body) = "warranty_end_date"];
  string notes = 8 [(api.body) = "notes"];
  repeated string tags = 9 [(api.body) = "tags"];
}

message CreateAssetResponse {
  Asset asset = 1;
}

// Full replacement of the editable fields; status and image are managed elsewhere.
message UpdateAssetRequest {
  string id = 1 [(api.path) = "id"];
  string name = 2 [(api.body) = "name"];
  int64 price_cents = 3 [(api.body) = "price_cents"];
  string purchase_date = 4 [(api.body) = "purchase_date"];
  // Same keys as CreateAsset; omitted/empty preserves the existing icon.
  string icon_key = 5 [(api.body) = "icon_key"];
  optional string purchase_channel = 6 [(api.body) = "purchase_channel"];
  optional string warranty_end_date = 7 [(api.body) = "warranty_end_date"];
  optional string notes = 8 [(api.body) = "notes"];
  // A nil slice preserves old values; an explicit [] clears all tags.
  repeated string tags = 9 [(api.body) = "tags"];
}

message UpdateAssetResponse {
  Asset asset = 1;
}

message UpdateAssetStatusRequest {
  string id = 1 [(api.path) = "id"];
  // Exact HTTP JSON status: ACTIVE or RETIRED.
  string status = 2 [(api.body) = "status"];
  // Required for RETIRED, between purchase date and today inclusive; empty for ACTIVE.
  string retired_date = 3 [(api.body) = "retired_date"];
}

message UpdateAssetStatusResponse {
  Asset asset = 1;
}

message UpdateAssetArchiveRequest {
  string id = 1 [(api.path) = "id"];
  // ARCHIVE or RESTORE. Required; repeated requests are safe.
  string action = 2 [(api.body) = "action"];
}

message UpdateAssetArchiveResponse {
  Asset asset = 1;
}

// Legacy message definitions retained for stored data compatibility.
// Business CRUD is local-only; public services are defined in m5/v1/m5.proto.
